[package]
name = "rover-uefi"
version = "0.1.0"
edition = "2024"
authors = ["Muhammad Fiaz <contact@muhammadfiaz.com>"]
description = "A modern, feature-rich, cross-platform firmware development library for UEFI and PI specifications in Rust"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/muhammad-fiaz/rover-uefi"
homepage = "https://github.com/muhammad-fiaz/rover-uefi#readme"
categories = ["embedded", "no-std", "os", "hardware-support", "cryptography"]
keywords = ["uefi", "firmware", "no-std", "bootloader", "pi"]

[features]
default = []

[dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
manual_is_multiple_of = "allow"