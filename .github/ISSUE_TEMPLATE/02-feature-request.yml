name: 'Feature Request'
description: 'Suggest a new UEFI/PI protocol, architecture support, or library improvement'
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to `rover-uefi`!
        Please fill out this form with details on the proposed capability and relevant UEFI/PI specification references.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Missing Capability
      description: A clear and concise description of what capability is missing or what problem this feature solves.
      placeholder: Describe the use case, missing protocol, or architecture backend needed...
    validations:
      required: true
      min_length: 20

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe how the protocol, ABI, or safe wrapper should be structured in `rover-uefi`.
      render: rust
      placeholder: Proposed types, functions, or protocol interfaces...
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Normative Specification Reference
      description: Relevant section from UEFI 2.10, PI 1.8, ACPI, or architecture reference manual.
      placeholder: e.g. UEFI Specification v2.10 Section 14.5 or PI v1.8 Vol 2
    validations:
      required: false

  - type: checkboxes
    id: targets
    attributes:
      label: Target Architectures
      description: Which architectures will benefit from this feature?
      options:
        - label: x86_64
        - label: AArch64 (ARM64)
        - label: RISC-V (RV64)
        - label: IA-32 (x86 32-bit)
        - label: ARM32 (ARMv7-A)
        - label: LoongArch64

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or temporary workarounds explored.
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Relevant Specifications or Mockups
      description: Upload specification excerpts, diagrams, or architectural charts if applicable.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.pdf,.txt,.zip"

  - type: checkboxes
    id: checks
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request implementing this feature.
          required: false
        - label: I agree to follow this project's [Code of Conduct](https://github.com/muhammad-fiaz/rover-uefi/blob/main/CODE_OF_CONDUCT.md).
          required: true
