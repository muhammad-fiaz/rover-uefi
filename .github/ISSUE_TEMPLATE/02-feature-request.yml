name: 'Feature Request'
description: 'Suggest a new UEFI/PI protocol, architecture support, or library improvement'
title: '[Feature]: '
labels: ['enhancement']
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to `rover-uefi`!
        Please fill out this form with details on the proposed capability and relevant UEFI/PI specification references.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Missing Capability
      description: A clear and concise description of what capability is missing or what problem this feature solves.
      placeholder: Describe the use case, missing protocol, or architecture backend needed...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Current importance level assigned to this feature request.
      options:
        - 'P1 - High (Critical milestone requirement or core specification gap)'
        - 'P2 - Medium (Valuable enhancement for broad UEFI developer use)'
        - 'P3 - Low (Nice-to-have, niche hardware protocol, or future roadmap)'
      default: 1
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: Relative level of effort estimated for implementing this feature.
      options:
        - 'XS - Trivial (Minor API convenience wrapper or constant addition)'
        - 'S - Small (Single protocol interface with integration test, 1-2 days)'
        - 'M - Medium (Subsystem driver or multi-protocol stack, 1 week)'
        - 'L - Large (Major subsystem: e.g. full graphics pipeline, filesystem)'
        - 'XL - Complex (Full architecture port: e.g. new CPU backend & registers)'
      default: 1
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe how the protocol, ABI, or safe wrapper should be structured in `rover-uefi`.
      render: rust
      placeholder: Proposed types, functions, or protocol interfaces...
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Normative Specification Reference
      description: Relevant section from UEFI 2.10, PI 1.8, ACPI, or architecture reference manual.
      placeholder: e.g. UEFI Specification v2.10 Section 14.5 or PI v1.8 Vol 2
    validations:
      required: false

  - type: checkboxes
    id: targets
    attributes:
      label: Target Architectures
      description: Which architectures will benefit from this feature?
      options:
        - label: x86_64
        - label: AArch64 (ARM64)
        - label: RISC-V (RV64)
        - label: IA-32 (x86 32-bit)
        - label: ARM32 (ARMv7-A)
        - label: LoongArch64

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or temporary workarounds explored.
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Relevant Specifications or Mockups
      description: Upload or drag and drop specification excerpts, diagrams, or architectural charts directly here.
      placeholder: Drag and drop images or diagrams here...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request implementing this feature.
          required: false
        - label: I agree to follow this project's [Code of Conduct](https://github.com/muhammad-fiaz/rover-uefi/blob/main/CODE_OF_CONDUCT.md).
          required: true
