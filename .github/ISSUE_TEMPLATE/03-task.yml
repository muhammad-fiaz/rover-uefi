name: 'Task'
description: 'A specific piece of maintenance, refactoring, or driver engineering work'
title: '[Task]: '
labels: ['task']
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this template for discrete firmware tasks, test suite additions, refactorings, or maintenance items.

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Detailed summary of the work to be accomplished.
      placeholder: Describe the engineering task, components affected, and acceptance criteria...
    validations:
      required: true
      min_length: 20

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Current importance level assigned to this task.
      options:
        - 'P0 - Blocker'
        - 'P1 - High'
        - 'P2 - Medium'
        - 'P3 - Low'
      default: 2
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: Relative level of effort for completing this task.
      options:
        - 'XS - Trivial (< 2 hours)'
        - 'S - Small (1-2 days)'
        - 'M - Medium (3-5 days)'
        - 'L - Large (1-2 weeks)'
        - 'XL - Complex (> 2 weeks)'
      default: 1
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: Acceptance Criteria / Todo List
      description: Bullet list of specific deliverables required to consider this task complete.
      value: |
        - [ ] Implementation in `#![no_std]` Rust
        - [ ] Unit & integration tests added in `tests/`
        - [ ] Pass `cargo fmt`, `cargo clippy`, and `cargo check --all-targets`
        - [ ] Documentation updated
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Agreement
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/muhammad-fiaz/rover-uefi/blob/main/CODE_OF_CONDUCT.md).
          required: true
